<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="styles.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <title>Frontend Mentor | Product preview card component</title>
  </head>
  <body>
    <div class="container">
      <div class="image-container">
        <img
          src="image-product-desktop.jpg"
          alt="perfume picture"
          class="product-image"
        />
      </div>
      <div class="text-section">
        <h2 class="product-type">PERFUME</h2>

        <h1 class="product-name">
          Gabrielle<br />
          Essence Eau<br />
          De Parfum
        </h1>

        <p class="product-description">
          A floral, solar and voluptuous<br />
          interpretation composed by<br />
          Olivier Polge, Perfumer-Creator<br />
          for the House of CHANEL.
        </p>
        <div class="price-container">
          <p class="discounted-price">$149.99</p>
          <p class="original-price">$169.99</p>
        </div>

        <button>
          <img src="icon-cart.svg" alt="cart" class="cart-icon" />
          <p>Add to Cart</p>
        </button>
      </div>
    </div>
    <!-- <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">great pantheon</a>.
  </div>-->
  </body>
</html>
