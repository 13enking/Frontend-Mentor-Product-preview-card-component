<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
     <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Product preview card component</title>
</head>
<body>
    <div class="container">
        <div class="image-section">
            <img src="image-product-desktop.jpg" alt="perfume picture">
        </div>
        <div class="text-section">
            <h2>PERFUME</h2>

            <h1>
                Gabrielle<br> 
                Essence Eau<br>
                 De Parfum  
            </h1>

            <p> A floral, solar and voluptuous<br>
                 interpretation composed by<br>
                 Olivier Polge, Perfumer-Creator<br> 
                 for the House of CHANEL.
            </p>
            <p class="price">$149.99 <span class="original-price">$169.99</span></p>
            <button><img src="icon-cart.svg" alt="cart">
            Add to Cart</button>
        </div>
    </div>

  </div>-->
</body>
</html>
